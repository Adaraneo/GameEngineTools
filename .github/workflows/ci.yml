name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Core engine tests
        run: dotnet test EngineTests/EngineTests.csproj --configuration Release --verbosity minimal

      - name: TerraGen tests
        run: dotnet test TerraGenTests/TerraGenTests.csproj --configuration Release --verbosity minimal

      - name: WorldGen tests
        run: dotnet test WorldGenTests/WorldGenTests.csproj --configuration Release --verbosity minimal
